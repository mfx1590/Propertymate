services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: propverify
      POSTGRES_PASSWORD: propverify
      POSTGRES_DB: propverify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propverify"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: dev_master_key_change_me
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: propverify
      MINIO_ROOT_PASSWORD: propverify_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # one-shot job: creates the media (public) and documents (private) buckets
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 propverify propverify_secret;
      mc mb --ignore-existing local/media;
      mc mb --ignore-existing local/documents;
      mc anonymous set download local/media;
      exit 0;
      "

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
