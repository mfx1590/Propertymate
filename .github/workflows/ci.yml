name: CI

on:
  push:
    branches: [main]
    # Docs-only pushes spend nothing: there is nothing to test, and on a private
    # repo every run is metered minutes (the 2026-09-10 billing stop).
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start infrastructure (postgres, redis, meilisearch, minio + buckets)
        run: docker compose up -d --wait

      - name: Env files
        run: |
          cp .env.example .env
          cp .env.example apps/api/.env

      - name: Prisma generate + migrate + seed
        run: |
          npm run db:generate
          npm run db:deploy -w apps/api
          npm run db:seed

      - name: Build API (shared package first)
        run: |
          npm run build -w packages/shared
          npm run build -w apps/api

      - name: Fetch OCR language data (step 28)
        run: npm run ocr:fetch -w apps/api

      # Prints what THIS runner's fonts + Tesseract read off the synthetic
      # passport, so an OCR e2e failure is diagnosable from the log alone.
      - name: OCR probe (informational)
        run: npm run ocr:probe -w apps/api

      - name: Start API
        # Rate limiting off for the suites (non-production only — see
        # apps/api/src/common/guards/app-throttler.guard.ts). Before this, each
        # pair of suites needed a 60s pause for the OTP window to drain: 21
        # minutes of sleep in a 25-minute pipeline.
        env:
          AUTH_THROTTLE_BYPASS: '1'
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health >/dev/null; then echo "API up"; break; fi
            sleep 1
          done

      - name: Run critical-flow e2e suite
        run: npm run test:e2e -w apps/api

      - name: Run project-module e2e suite
        run: npm run test:e2e:projects -w apps/api

      - name: Run agency-team e2e suite
        run: npm run test:e2e:team -w apps/api

      - name: Run reputation + analytics e2e suite
        run: npm run test:e2e:reputation -w apps/api

      - name: Run notification-channel e2e suite
        run: npm run test:e2e:notifications -w apps/api

      - name: Run lead-inbox e2e suite
        run: npm run test:e2e:leads -w apps/api

      - name: Run recommendation e2e suite
        run: npm run test:e2e:recommendations -w apps/api

      - name: Run contract e-sign e2e suite
        run: npm run test:e2e:contracts -w apps/api

      - name: Run referral e2e suite
        run: npm run test:e2e:referrals -w apps/api

      - name: Run admin-console e2e suite
        run: npm run test:e2e:admin -w apps/api

      - name: Run search-suggestion e2e suite
        run: npm run test:e2e:search -w apps/api

      - name: Run push-device e2e suite
        run: npm run test:e2e:push -w apps/api

      - name: Run review-moderation e2e suite
        run: npm run test:e2e:moderation -w apps/api

      - name: Run discovery-alert e2e suite
        run: npm run test:e2e:alerts -w apps/api

      - name: Run region-page e2e suite
        run: npm run test:e2e:regions -w apps/api

      - name: Run agent-mandate e2e suite
        run: npm run test:e2e:mandate -w apps/api

      - name: Run map-search e2e suite
        run: npm run test:e2e:map -w apps/api

      - name: Run lawyer-marketplace e2e suite
        run: npm run test:e2e:legal -w apps/api

      - name: Run payment-ledger e2e suite
        run: npm run test:e2e:payments -w apps/api

      - name: Run market-insights e2e suite
        run: npm run test:e2e:insights -w apps/api

      - name: Run dispute-workflow e2e suite
        run: npm run test:e2e:disputes -w apps/api

      - name: Run data-export e2e suite
        run: npm run test:e2e:exports -w apps/api

      - name: Run identity-OCR e2e suite
        run: npm run test:e2e:ocr -w apps/api

      - name: API logs on failure
        if: failure()
        run: tail -80 api.log || true
